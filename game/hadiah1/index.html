<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadiah 1</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
    }
    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    #notice {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        font-size: 14px;
        padding: 5px 10px;
        border-radius: 5px;
        font-family: sans-serif;
        display: none;
        z-index: 10;
    }
</style>
</head>
<body>

<div id="notice">Ketuk untuk mengaktifkan suara</div>

<video id="myVideo" autoplay playsinline>
    <source src="pemandangan.mp4" type="video/mp4">
    Browser Anda tidak mendukung video.
</video>

<script>
    const video = document.getElementById('myVideo');
    const notice = document.getElementById('notice');

    // Coba langsung play dengan suara
    video.muted = false;
    video.play().catch(() => {
        // Kalau gagal, mute dulu dan tampilkan notice
        video.muted = true;
        video.play();
        notice.style.display = 'block';
    });

    // Kalau notice diklik, unmute dan play lagi
    document.body.addEventListener('click', () => {
        if (video.muted) {
            video.muted = false;
            video.play();
            notice.style.display = 'none';
        }
    });
</script>

</body>
</html>
