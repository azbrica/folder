<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>love - Timed Lyrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Serif';
      background: url('pemandangan.mp4') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-shadow: 2px 2px 5px #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    audio {
      margin-top: 20px;
    }
    #lyrics {
      font-size: 2em;
      text-align: center;
      width: 80%;
    }
  </style>
</head>
<body>
  <div id="lyrics">Loading...</div>
  <audio id="audio" controls autoplay>
    <source src="pemandangan.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script>
  const lrc = `[00:00.00]Living all alone kinda forgot it's been that long
               [00:07.00]Since someone's gone, I've been trying to be a little bit strong
               [00:14.00]And it is not that easy to be exactly who I was
               [00:21.00]My shit is done, now it's time for me try to moving on
               [00:28.00]'Cuz if you think I'm such a happy person, no you are wrong
               [00:35.00]By saying my laughter is louder than yours
               [00:39.00]Shut your freakin' mouth
               [00:42.00]No one knows what I feel and what I suffer, no they don't know
               [00:49.00]So keep your thoughts and stop assuming that
               [00:54.00]Someone is always fine`.trim().split('\n');
    const lyrics = lrc.map(line => {
      const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
      if (!match) return null;
      const minutes = parseInt(match[1]);
      const seconds = parseFloat(match[2]);
      const time = minutes * 60 + seconds;
      return { time, text: match[3] };
    }).filter(line => line);

    const audio = document.getElementById('audio');
    const lyricsDiv = document.getElementById('lyrics');

    function updateLyrics() {
      const currentTime = audio.currentTime;
      for (let i = lyrics.length - 1; i >= 0; i--) {
        if (currentTime >= lyrics[i].time) {
          lyricsDiv.textContent = lyrics[i].text;
          break;
        }
      }
    }

    audio.addEventListener('timeupdate', updateLyrics);
  </script>
</body>
</html>
