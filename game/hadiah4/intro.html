<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ngomong ke Mochi</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
    }
    .words {
      background: #222;
      border-radius: 1rem;
      padding: 1rem;
      margin: 1rem auto;
      width: max-content;
      text-align: left;
    }
    .words p {
      margin: 0.3rem 0;
    }
    .button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #00ff99;
      color: #000;
      border: none;
      border-radius: 1rem;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎤 Ngomong ke Mochi~</h1>
  <p>Mochi bisa denger suara kamu dan bereaksi! Coba ucapin kata-kata ini:</p>

  <div class="words">
    <p>❤️ "love", "sayang", "cinta"</p>
    <p>😡 "angry", "marah"</p>
    <p>😂 "laugh", "ketawa"</p>
    <p>😴 "sleepy", "ngantuk"</p>
    <p>❌ "tidak", "nggak", "ga" (geleng kepala)</p>
  </div>

  <button class="button" onclick="window.location.href='index.html'">Masuk ke Mochi</button>
</body>
</html>
