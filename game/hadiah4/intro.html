<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dasai Mochi - Intro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      flex-direction: column;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      background-color: #000;
      color: #00ff88;
      min-height: 100vh;
      gap: 20px;
    }

    .info-box {
      border: 2px solid #00ff88;
      padding: 20px;
      max-width: 300px;
      text-align: center;
      background-color: rgba(0, 255, 136, 0.08);
      border-radius: 12px;
    }

    .info-box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .info-box p {
      font-size: 15px;
      line-height: 1.4;
    }

    .reaction-box {
      border: 2px dashed #00ff88;
      padding: 15px;
      border-radius: 12px;
      width: 280px;
      text-align: center;
      min-height: 50px;
    }
  </style>
</head>
<body>

  <div class="info-box">
    <h2>👀 Dasai Mochi bisa dengar suara kamu!</h2>
    <p>
      Ucapkan kata seperti <b>"senyum"</b>, <b>"marah"</b>, <b>"musik"</b>, atau <b>"pelangi"</b><br>
      dan Mochi akan bereaksi sesuai ekspresi kamu!
    </p>
  </div>

  <div class="reaction-box" id="reactionBox">Mochi menunggu suara kamu...</div>

  <!-- Tombol tetap tidak diubah -->
  <button class="btn" onclick="window.location.href='index.html'">Mulai
    <div class="stars s1">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s2">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s3">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s4">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s5">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s6">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
    <div class="stars s7">
      <img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star">
    </div>
  </button>

  <script>
    const kataMochi = {
      "senang": "smile",
      "bahagia": "smile",
      "senyum": "smile",
      "marah": "angry",
      "bete": "angry",
      "jelek": "angry",
      "kesal": "angry",
      "sedih": "crying",
      "nangis": "crying",
      "cinta": "love",
      "sayang": "love",
      "ganteng": "love",
      "cantik": "love",
      "musik": "music",
      "lagu": "music",
      "ngantuk": "sleepy",
      "malas": "sleepy",
      "polisi": "police",
      "pelangi": "rainbow",
      "tertawa": "laugh",
      "ngakak": "laugh",
      "ketawa": "laugh",
      "nakal": "look_down",
      "liat kiri": "look_left",
      "liat kanan": "look_right",
      "cium": "raspberry",
      "lampu nyala": "headlights",
      "fokus": "distracted",
      "lag": "glitch",
      "eror": "glitch",
      "lucu": "uwu",
      "smirk": "smirk",
      "gaspol": "revs",
      "mini": "shrink",
      "achoo": "sneeze",
      "julit": "smirk",
      "turbo": "turbo",
      "terbalik": "upside_down",
      "bintang": "stars",
      "sakura": "sakura"
    };

    const reactionBox = document.getElementById("reactionBox");

    // Cek browser support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      reactionBox.textContent = "Browsermu tidak mendukung voice recognition 😅";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.interimResults = false;
      recognition.continuous = true; // terus dengar

      recognition.onresult = function(event) {
        const spokenWord = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        if (kataMochi[spokenWord]) {
          reactionBox.textContent = "Mochi bereaksi: " + kataMochi[spokenWord];
        } else {
          reactionBox.textContent = "Mochi bingung 😅";
        }
      };

      recognition.onerror = function(event) {
        reactionBox.textContent = "Error: " + event.error;
      };

      recognition.start();
    }
  </script>

</body>
</html>
