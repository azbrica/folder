<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kue Ulang Tahun Interaktif</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="birthday-content">
    <div class="cake-container">
      <div class="title">
        <h1>HAPPY BIRTHDAY <span class="name">My Love</span></h1>
        <p>Make a wish and blow the candle 🎂 (use your voice!)</p>
      </div>

      <!-- Kue -->
      <div class="cake">
        <div class="layer layer-bottom"></div>
        <div class="layer layer-middle"></div>
        <div class="layer layer-top"></div>
        <div class="candle-container">
          <div class="candle"></div>
          <div class="flame"></div>
        </div>
        <div class="cake-particles" id="fireParticles"></div>
        <div class="smoke-puff" id="smokePuff"></div>
      </div>
    </div>
  </div>

  <!-- Pesan Ulang Tahun -->
  <div class="message" id="wishMessage" class="hidden">
    Selamat Ulang Tahun! 🎉
  </div>

  <!-- Status Suara -->
  <div class="mic-status" id="micStatus"></div>

  <!-- Lagu -->
  <audio id="birthdaySong" src="happybirthday.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
