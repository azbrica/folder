<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Couple Memory Game</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <h1>
            <ion-icon name="heart"></ion-icon>
            Anime Couple Memory Game
            <ion-icon name="heart"></ion-icon>
        </h1>
        <p>Find the anime couples! Match the girl and boy from the same couple</p>
    </div>

    <div class="game-info">
        <div class="info-item">
            <ion-icon name="time-outline"></ion-icon>
            <span id="timer">00:00</span>
        </div>
        <div class="info-item">
            <ion-icon name="trophy-outline"></ion-icon>
            <span id="moves">Moves: 0</span>
        </div>
        <div class="info-item">
            <ion-icon name="people-outline"></ion-icon>
            <span id="matches">Couples: 0/8</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="startNewGame()">
            <ion-icon name="refresh-outline"></ion-icon>
            New Game
        </button>
        <button class="btn" onclick="pauseGame()">
            <ion-icon name="pause-outline"></ion-icon>
            Pause
        </button>
        <button class="btn" onclick="showHint()">
            <ion-icon name="bulb-outline"></ion-icon>
            Hint
        </button>
    </div>

    <div class="game-board" id="gameBoard">
        <!-- Cards will be generated by JavaScript -->
    </div>

    <!-- Couple display popup -->
    <div class="couple-display" id="coupleDisplay">
        <div class="couple-images">
            <img src="/placeholder.svg?height=120&width=120" alt="Male Character" id="maleImage" class="couple-image">
            <div class="heart-icon">
                <ion-icon name="heart"></ion-icon>
            </div>
            <img src="/placeholder.svg?height=120&width=120" alt="Female Character" id="femaleImage" class="couple-image">
        </div>
        <div class="couple-name" id="coupleName"></div>
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <div class="celebration">💕✨🎊</div>
            <h2>Congratulations!</h2>
            <p>You successfully matched all anime couples!</p>
            <p id="finalStats"></p>
            <button class="btn" onclick="startNewGame()">
                <ion-icon name="play-outline"></ion-icon>
                Play Again
            </button>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
