<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Tembakan Tanggal Lahir</title>
  <link href="https://fonts.googleapis.com/css?family=Averia+Libre:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Musik background loop -->
  <audio autoplay loop>
    <source src="lagugame.mp3" type="audio/mpeg">
  </audio>
  
  <div class="wrapper">
    <div class="page">
      <p>Pilih Tanggal, Bulan Lahir, dan Nama</p>
      <div class="radio-wrapper">
        <label for="tanggal">Tanggal:</label>
        <select id="tanggal">
          <option value="">--</option>
          <script>
            for (let i = 1; i <= 31; i++) {
              document.write(`<option value="${i}">${i}</option>`);
            }
          </script>
        </select>

        <label for="bulan">Bulan:</label>
        <select id="bulan">
          <option value="">--</option>
          <script>
            const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
            bulan.forEach((b, i) => {
              document.write(`<option value="${i + 1}">${b}</option>`);
            });
          </script>
        </select>

        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Masukkan nama awal" maxlength="50">

        <button id="tembak">TEMBAK!</button>
      </div>
    </div>

    <div class="gun">
      <div class="gun__main">
        <div class="gun__handle">
          <div class="bottom"></div>
          <div class="middle"></div>
          <div class="top">
            <div class="line line-short"></div>
            <div class="line line-long"></div>
            <div class="line line-long"></div>
            <div class="line line-short"></div>
            <div class="line line-short"></div>
          </div>
        </div>
        <div class="gun__accent-2"></div>
        <div class="gun__accent-1"></div>
        <div class="gun__yellow">
          <div class="line"></div>
        </div>
        <div class="gun__trigger"></div>
        <div class="gun__accent-3"></div>
        <div class="gun__accent-4"></div>
      </div>
      <div class="bullet"></div>
    </div>
  </div>

  <div class="result" style="text-align:center; margin-top: 40px; font-size: 24px;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
