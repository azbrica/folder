<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Circle 6 Cards</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #000;
      margin: 0;
    }

    .main {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .share-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 1px solid rgba(128, 128, 128, 0.705);
      z-index: 2;
      cursor: pointer;
    }

    .share-btn:hover {
      box-shadow: 0 0 15px #fff, 0 0 25px #aaa;
    }

    .card {
      position: absolute;
      width: 90px;
      height: 90px;
      background: white;
      border: none;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
                  rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms ease;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
    }

    .card:hover {
      cursor: pointer;
      scale: 1.1;
    }

    .card1:hover { background-color: #ffb6c1; }
    .card2:hover { background-color: #ff4444; }
    .card3:hover { background-color: #8bc34a; }
    .card4:hover { background-color: #7e57c2; }
    .card5:hover { background-color: #81d4fa; }
    .card6:hover { background-color: #ffcc80; }
  </style>
</head>
<body>
  <div class="main">
    <div class="share-btn">🎮</div>
    <button class="card card1" data-active="false" style="top:0%; left:50%;">🌷</button>
    <button class="card card2" data-active="false" style="top:25%; left:93%;">🏷</button>
    <button class="card card3" data-active="false" style="top:75%; left:93%;">🐸</button>
    <button class="card card4" data-active="false" style="top:100%; left:50%;">🔮</button>
    <button class="card card5" data-active="false" style="top:75%; left:7%;">🔢</button>
    <button class="card card6" data-active="false" style="top:25%; left:7%;">⚡</button>
  </div>

  <script>
    const shareBtn = document.querySelector(".share-btn");
    const cards = document.querySelectorAll(".card");

    shareBtn.addEventListener("click", () => {
      cards.forEach(card => {
        const isActive = card.getAttribute("data-active") === "true";
        card.setAttribute("data-active", !isActive);

        // Ganti scale-nya sambil tetap jaga posisi translate
        const baseTransform = "translate(-50%, -50%)";
        const newScale = !isActive ? "scale(1)" : "scale(0)";
        card.style.transform = `${baseTransform} ${newScale}`;
      });
    });

    // Arahkan klik masing-masing emoji ke URL tertentu
    document.querySelector(".card1").onclick = () => location.href = "hadiah3/index.html";
    document.querySelector(".card2").onclick = () => location.href = "https://novaa-forge.github.io/Impossible-Game/";
    document.querySelector(".card3").onclick = () => location.href = "hadiah4/intro.html";
    document.querySelector(".card4").onclick = () => location.href = "hadiah5/index.html";
    document.querySelector(".card5").onclick = () => location.href = "hadiah1/index.html";
    document.querySelector(".card6").onclick = () => location.href = "hadiah2/index.html";
  </script>
</body>
</html>
