<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@codewith_muhilan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgb(0, 0, 0);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .share-btn {
      position: absolute;
      display: flex;
      cursor: pointer;
      align-items: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: .2s ease-in-out;
      scale: .8;
      padding: 10px;
      width: 30px;
      height: 30px;
      z-index: 10;
      font-size: 20px;
      justify-content: center;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: .9;
    }

    .up,
    .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1,
    .card2,
    .card3,
    .card4 {
      width: 90px;
      height: 90px;
      font-size: 28px;
      outline: none;
      border: none;
      background: white;
      border-radius: 90px 5px 5px 5px;
      box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
    }

    .card2 {
      border-radius: 5px 90px 5px 5px;
      transition: 300ms cubic-bezier(0.76, -0.19, 0.15, 1.17);
    }

    .card3 {
      border-radius: 5px 5px 5px 90px;
      transition: 300ms cubic-bezier(0.72, -0.26, 0.02, 1.46);
    }

    .card4 {
      border-radius: 5px 5px 90px 5px;
      transition: 300ms cubic-bezier(1, -0.31, 0.02, 1.46);
    }

    .card1[data-toggle1="true"] {
      transform: translateY(50px) translateX(60px) scale(0);
    }

    .card2[data-toggle2="true"] {
      transform: translateY(50px) translateX(-60px) scale(0);
    }

    .card3[data-toggle3="true"] {
      transform: translateY(-50px) translateX(60px) scale(0);
    }

    .card4[data-toggle4="true"] {
      transform: translateY(-50px) translateX(-60px) scale(0);
    }

    .card1:hover,
    .card2:hover,
    .card3:hover,
    .card4:hover {
      cursor: pointer;
      scale: 1.1;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn">🔄</div>

    <div class="up">
      <button data-toggle1="false" class="card1">📸</button>
      <button data-toggle2="false" class="card2">💎</button>
    </div>

    <div class="down">
      <button data-toggle3="false" class="card3">🌷</button>
      <button data-toggle4="false" class="card4">⏰</button>
    </div>
  </div>

  <script>
    const shareBtn = document.querySelector(".share-btn");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    shareBtn.addEventListener("click", () => {
      const toggle = card1.getAttribute("data-toggle1") === "true";
      card1.setAttribute("data-toggle1", !toggle);
      card2.setAttribute("data-toggle2", !toggle);
      card3.setAttribute("data-toggle3", !toggle);
      card4.setAttribute("data-toggle4", !toggle);
    });

    card1.addEventListener("click", () => window.location.href = "halaman1.html");
    card2.addEventListener("click", () => window.location.href = "halaman2.html");
    card3.addEventListener("click", () => window.location.href = "halaman3.html");
    card4.addEventListener("click", () => window.location.href = "halaman4.html");
  </script>
</body>

</html>
