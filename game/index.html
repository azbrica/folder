<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@codewith_muhilan</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgb(0, 0, 0);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .share-btn {
      position: absolute;
      display: flex;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: .2s ease-in-out;
      scale: .8;
      padding: 10px;
      width: 60px;
      height: 60px;
      font-size: 28px;
      z-index: 10;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: .9;
    }

    .up, .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1, .card2, .card3, .card4 {
      width: 90px;
      height: 90px;
      outline: none;
      border: none;
      background: white;
      border-radius: 90px 5px 5px 5px;
      box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
                  rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
    }

    .card2 { border-radius: 5px 90px 5px 5px; }
    .card3 { border-radius: 5px 5px 5px 90px; }
    .card4 { border-radius: 5px 5px 90px 5px; }

    .card1[data-toggle1="true"] {
      transform: translateY(50px) translateX(60px) scale(1);
    }

    .card2[data-toggle2="true"] {
      transform: translateY(50px) translateX(-60px) scale(1);
    }

    .card3[data-toggle3="true"] {
      transform: translateY(-50px) translateX(60px) scale(1);
    }

    .card4[data-toggle4="true"] {
      transform: translateY(-50px) translateX(-60px) scale(1);
    }

    .card1:hover { background-color: #cc39a4; color: white; scale: 1.1; }
    .card2:hover { background-color: #03A9F4; color: white; scale: 1.1; }
    .card3:hover { background-color: #333;     color: white; scale: 1.1; }
    .card4:hover { background-color: #8c9eff;  color: white; scale: 1.1; }

    /* sembunyikan awalnya */
    .card1, .card2, .card3, .card4 {
      display: none;
      transform: scale(0);
    }

    .card1[data-toggle1="true"],
    .card2[data-toggle2="true"],
    .card3[data-toggle3="true"],
    .card4[data-toggle4="true"] {
      display: flex;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn" id="toggleButton">🔗</div>

    <div class="up">
      <button data-toggle1="false" class="card1" onclick="location.href='page1.html'">❤️</button>
      <button data-toggle2="false" class="card2" onclick="location.href='page2.html'">🐦</button>
    </div>

    <div class="down">
      <button data-toggle3="false" class="card3" onclick="location.href='page3.html'">🐙</button>
      <button data-toggle4="false" class="card4" onclick="location.href='page4.html'">🎮</button>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("toggleButton");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    toggleBtn.addEventListener("click", () => {
      const status = card1.getAttribute("data-toggle1") === "true";

      card1.setAttribute("data-toggle1", !status);
      card2.setAttribute("data-toggle2", !status);
      card3.setAttribute("data-toggle3", !status);
      card4.setAttribute("data-toggle4", !status);
    });
  </script>
</body>

</html>
