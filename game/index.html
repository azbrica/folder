<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@codewith_muhilan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgb(0, 0, 0);
      overflow: hidden;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .share-btn {
      position: relative;
      display: flex;
      cursor: pointer;
      align-items: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: 0.2s ease-in-out;
      scale: 0.8;
      padding: 10px;
      width: 60px;
      height: 60px;
      z-index: 10;
      font-size: 24px;
      justify-content: center;
      box-shadow: 0 0 20px #e095fea1;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: 0.9;
    }

    .up,
    .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1,
    .card2,
    .card3,
    .card4 {
      width: 90px;
      height: 90px;
      font-size: 28px;
      outline: none;
      border: none;
      background: white;
      border-radius: 90px 5px 5px 5px;
      box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
        rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
    }

    .card2 {
      border-radius: 5px 90px 5px 5px;
      transition: 300ms cubic-bezier(0.76, -0.19, 0.15, 1.17);
    }

    .card3 {
      border-radius: 5px 5px 5px 90px;
      transition: 300ms cubic-bezier(0.72, -0.26, 0.02, 1.46);
    }

    .card4 {
      border-radius: 5px 5px 90px 5px;
      transition: 300ms cubic-bezier(1, -0.31, 0.02, 1.46);
    }

    .card1[data-toggle1="true"],
    .card2[data-toggle2="true"],
    .card3[data-toggle3="true"],
    .card4[data-toggle4="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card1[data-toggle1="false"] {
      transform: translateY(50px) translateX(60px) scale(0);
    }

    .card2[data-toggle2="false"] {
      transform: translateY(50px) translateX(-60px) scale(0);
    }

    .card3[data-toggle3="false"] {
      transform: translateY(-50px) translateX(60px) scale(0);
    }

    .card4[data-toggle4="false"] {
      transform: translateY(-50px) translateX(-60px) scale(0);
    }

    .card1:hover,
    .card2:hover,
    .card3:hover,
    .card4:hover {
      cursor: pointer;
      scale: 1.1;
    }

    .stars img {
      position: absolute;
      transition: all 1s cubic-bezier(0.05, 0.83, 0.43, 0.96);
      z-index: 1;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 0 8px #ffefff);
      opacity: 0;
      width: 0;
    }

    .s1 img { top: -50%; left: -50%; width: 30px; }
    .s2 img { top: -70%; left: 0%; width: 20px; }
    .s3 img { top: -40%; left: 60%; width: 15px; }
    .s4 img { top: 80%; left: -10%; width: 10px; }
    .s5 img { top: 90%; left: 80%; width: 25px; }
    .s6 img { top: 0%; left: 120%; width: 15px; }
    .s7 img { top: 30%; left: -80%; width: 10px; }

    .share-btn.clicked .stars img {
      opacity: 1;
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn" id="shareBtn">🔄
      <div class="stars s1"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s2"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s3"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s4"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s5"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s6"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
      <div class="stars s7"><img src="https://i.ibb.co/r2Ys6q3s/star.png" alt="star"></div>
    </div>

    <div class="up">
      <button data-toggle1="false" class="card1">📸</button>
      <button data-toggle2="false" class="card2">💎</button>
    </div>

    <div class="down">
      <button data-toggle3="false" class="card3">🌷</button>
      <button data-toggle4="false" class="card4">⏰</button>
    </div>
  </div>

  <script>
    const shareBtn = document.getElementById("shareBtn");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    let isActive = false;

    shareBtn.addEventListener("click", () => {
      isActive = !isActive;

      card1.setAttribute("data-toggle1", isActive);
      card2.setAttribute("data-toggle2", isActive);
      card3.setAttribute("data-toggle3", isActive);
      card4.setAttribute("data-toggle4", isActive);

      shareBtn.classList.add("clicked");
      setTimeout(() => {
        shareBtn.classList.remove("clicked");
      }, 500);
    });

    card1.addEventListener("click", () => window.location.href = "halaman1.html");
    card2.addEventListener("click", () => window.location.href = "halaman2.html");
    card3.addEventListener("click", () => window.location.href = "halaman3.html");
    card4.addEventListener("click", () => window.location.href = "halaman4.html");
  </script>
</body>

</html>
