<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@codewith_muhilan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgb(0, 0, 0);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .share-btn {
      position: absolute;
      display: flex;
      cursor: pointer;
      align-items: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: .2s ease-in-out;
      scale: .8;
      padding: 10px;
      width: 30px;
      height: 30px;
      z-index: 10;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: .9;
    }

    .up,
    .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1,
    .card2,
    .card3,
    .card4 {
      width: 90px;
      height: 90px;
      outline: none;
      border: none;
      background: white;
      box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
        rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms;
    }

    .card1 {
      border-radius: 90px 5px 5px 5px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
    }

    .card2 {
      border-radius: 5px 90px 5px 5px;
      transition: 300ms cubic-bezier(0.76, -0.19, 0.15, 1.17);
    }

    .card3 {
      border-radius: 5px 5px 5px 90px;
      transition: 300ms cubic-bezier(0.72, -0.26, 0.02, 1.46);
    }

    .card4 {
      border-radius: 5px 5px 90px 5px;
      transition: 300ms cubic-bezier(1, -0.31, 0.02, 1.46);
    }

    .card1[data-toggle1="true"] {
      transform: translateY(50px) translateX(60px) scale(0);
    }

    .card2[data-toggle2="true"] {
      transform: translateY(50px) translateX(-60px) scale(0);
    }

    .card3[data-toggle3="true"] {
      transform: translateY(-50px) translateX(60px) scale(0);
    }

    .card4[data-toggle4="true"] {
      transform: translateY(-50px) translateX(-60px) scale(0);
    }

    .instagram {
      margin-top: 1.5em;
      margin-left: 1.2em;
      fill: #cc39a4;
    }

    .twitter {
      margin-top: 1.5em;
      margin-left: -.9em;
      fill: #03A9F4;
    }

    .github {
      margin-top: -.6em;
      margin-left: 1.2em;
    }

    .discord {
      margin-top: -.9em;
      margin-left: -1.2em;
      fill: #8c9eff;
    }

    .card1:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #cc39a4;
    }

    .card1:hover .instagram {
      fill: white;
    }

    .card2:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #03A9F4;
    }

    .card2:hover .twitter {
      fill: white;
    }

    .card3:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: rgb(39, 39, 39);
    }

    .card3:hover .github {
      fill: white;
    }

    .card4:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #8c9eff;
    }

    .card4:hover .discord {
      fill: white;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30px" height="30px" fill="currentColor"
        class="w-6 h-6">
        <path fill-rule="evenodd"
          d="M15.75 4.5a3 3 0 11.825 2.066l-8.421 4.679a3.002 3.002 0 010 1.51l8.421 4.679a3 3 0 11-.729 1.31l-8.421-4.678a3 3 0 110-4.132l8.421-4.679a3 3 0 01-.096-.755z"
          clip-rule="evenodd" />
      </svg>
    </div>
    <div class="up">
      <button data-toggle1="false" class="card1">
        <!-- Instagram SVG -->
        <!-- ... (isi SVG sama persis dengan aslinya) -->
      </button>
      <button data-toggle2="false" class="card2">
        <!-- Twitter SVG -->
        <!-- ... (isi SVG sama persis dengan aslinya) -->
      </button>
    </div>
    <div class="down">
      <button data-toggle3="false" class="card3">
        <!-- GitHub SVG -->
        <!-- ... (isi SVG sama persis dengan aslinya) -->
      </button>
      <button data-toggle4="false" class="card4">
        <!-- Discord SVG -->
        <!-- ... (isi SVG sama persis dengan aslinya) -->
      </button>
    </div>
  </div>

  <script>
    const shareBtn = document.querySelector(".share-btn");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    shareBtn.addEventListener("click", () => {
      if (card1.getAttribute("data-toggle1") === "true") {
        card1.setAttribute("data-toggle1", false);
        card2.setAttribute("data-toggle2", false);
        card3.setAttribute("data-toggle3", false);
        card4.setAttribute("data-toggle4", false);
      } else if (card1.getAttribute("data-toggle1") === "false") {
        card1.setAttribute("data-toggle1", true);
        card2.setAttribute("data-toggle2", true);
        card3.setAttribute("data-toggle3", true);
        card4.setAttribute("data-toggle4", true);
      }
    });
  </script>
</body>

</html>
