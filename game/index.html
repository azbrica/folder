<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@codewith_muhilan</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #000;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .share-btn {
      position: absolute;
      display: flex;
      cursor: pointer;
      align-items: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: 0.2s ease-in-out;
      scale: 0.8;
      padding: 10px;
      width: 30px;
      height: 30px;
      z-index: 10;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: 0.9;
    }

    .up,
    .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1,
    .card2,
    .card3,
    .card4 {
      width: 90px;
      height: 90px;
      outline: none;
      border: none;
      background: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
        rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
      transform: scale(0);
    }

    .card1 {
      border-radius: 90px 5px 5px 5px;
      transform: translateY(50px) translateX(60px) scale(0);
    }

    .card1[data-toggle1="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card2 {
      border-radius: 5px 90px 5px 5px;
      transform: translateY(50px) translateX(-60px) scale(0);
    }

    .card2[data-toggle2="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card3 {
      border-radius: 5px 5px 5px 90px;
      transform: translateY(-50px) translateX(60px) scale(0);
    }

    .card3[data-toggle3="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card4 {
      border-radius: 5px 5px 90px 5px;
      transform: translateY(-50px) translateX(-60px) scale(0);
    }

    .card4[data-toggle4="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card1:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #ffb6c1; /* pink */
    }

    .card2:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #ff4444; /* red */
    }

    .card3:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #8bc34a; /* green */
    }

    .card4:hover {
      cursor: pointer;
      scale: 1.1;
      background-color: #7e57c2; /* purple */
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30px" height="30px" fill="currentColor">
        <path fill-rule="evenodd"
          d="M15.75 4.5a3 3 0 11.825 2.066l-8.421 4.679a3.002 3.002 0 010 1.51l8.421 4.679a3 3 0 11-.729 1.31l-8.421-4.678a3 3 0 110-4.132l8.421-4.679a3 3 0 01-.096-.755z"
          clip-rule="evenodd" />
      </svg>
    </div>
    <div class="up">
      <button data-toggle1="false" class="card1">🌷</button>
      <button data-toggle2="false" class="card2">💥</button>
    </div>
    <div class="down">
      <button data-toggle3="false" class="card3">🐸</button>
      <button data-toggle4="false" class="card4">🎮</button>
    </div>
  </div>

  <script>
    const shareBtn = document.querySelector(".share-btn");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    shareBtn.addEventListener("click", () => {
      const active = card1.getAttribute("data-toggle1") === "true";
      card1.setAttribute("data-toggle1", !active);
      card2.setAttribute("data-toggle2", !active);
      card3.setAttribute("data-toggle3", !active);
      card4.setAttribute("data-toggle4", !active);
    });
  </script>
</body>

</html>
