<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@codewith_muhilan</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #000;
      margin: 0;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5em;
    }

    .share-btn {
      display: flex;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      border: 1px solid rgba(128, 128, 128, 0.705);
      border-radius: 50%;
      transition: 0.2s ease-in-out;
      font-size: 1.8rem;
      padding: 10px;
      width: 50px;
      height: 50px;
      z-index: 10;
      margin-bottom: 1.5em;
    }

    .share-btn:hover {
      background: #f1f1f1;
      scale: 0.95;
    }

    .up,
    .down {
      display: flex;
      flex-direction: row;
      gap: 0.5em;
    }

    .card1,
    .card2,
    .card3,
    .card4 {
      width: 90px;
      height: 90px;
      outline: none;
      border: none;
      background: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 2px 5px -1px,
        rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
      transition: 300ms cubic-bezier(0.73, -0.18, 0.02, 1.46);
      transform: scale(0);
      cursor: pointer;
    }

    .card1 {
      border-radius: 90px 5px 5px 5px;
      transform: translateY(50px) translateX(60px) scale(0);
    }

    .card1[data-toggle1="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card2 {
      border-radius: 5px 90px 5px 5px;
      transform: translateY(50px) translateX(-60px) scale(0);
    }

    .card2[data-toggle2="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card3 {
      border-radius: 5px 5px 5px 90px;
      transform: translateY(-50px) translateX(60px) scale(0);
    }

    .card3[data-toggle3="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card4 {
      border-radius: 5px 5px 90px 5px;
      transform: translateY(-50px) translateX(-60px) scale(0);
    }

    .card4[data-toggle4="true"] {
      transform: translateY(0) translateX(0) scale(1);
    }

    .card1:hover {
      scale: 1.1;
      background-color: #ffb6c1;
    }

    .card2:hover {
      scale: 1.1;
      background-color: #ff4444;
    }

    .card3:hover {
      scale: 1.1;
      background-color: #8bc34a;
    }

    .card4:hover {
      scale: 1.1;
      background-color: #7e57c2;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="share-btn">📤</div>
    <div class="up">
      <button id="btn1" data-toggle1="false" class="card1">🌷</button>
      <button id="btn2" data-toggle2="false" class="card2">💥</button>
    </div>
    <div class="down">
      <button id="btn3" data-toggle3="false" class="card3">🐸</button>
      <button id="btn4" data-toggle4="false" class="card4">🎮</button>
    </div>
  </div>

  <script>
    const shareBtn = document.querySelector(".share-btn");
    const card1 = document.querySelector(".card1");
    const card2 = document.querySelector(".card2");
    const card3 = document.querySelector(".card3");
    const card4 = document.querySelector(".card4");

    shareBtn.addEventListener("click", () => {
      const active = card1.getAttribute("data-toggle1") === "true";
      card1.setAttribute("data-toggle1", !active);
      card2.setAttribute("data-toggle2", !active);
      card3.setAttribute("data-toggle3", !active);
      card4.setAttribute("data-toggle4", !active);
    });

    // Redirect ke halaman
    document.getElementById("btn1").addEventListener("click", () => {
      window.location.href = "hadiah1.html";
    });

    document.getElementById("btn2").addEventListener("click", () => {
      window.location.href = "hadiah2.html";
    });

    document.getElementById("btn3").addEventListener("click", () => {
      window.location.href = "hadiah3.html";
    });

    document.getElementById("btn4").addEventListener("click", () => {
      window.location.href = "hadiah4.html";
    });
  </script>
</body>

</html>
