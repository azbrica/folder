<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folder Hadiah</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video autoplay muted loop id="bg-video">
    <source src="video.mp4" type="video/mp4" />
  </video>

  <!-- MUSIK BACKGROUND -->
  <audio id="bgm" autoplay loop muted>
    <source src="about.mp3" type="audio/mpeg" />
  </audio>

  <!-- PASSWORD SCREEN (Glowing Box) -->
  <div id="password-screen">
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2><i class="fa-solid fa-lock"></i> Masukkan Password</h2>
          <input type="password" id="password-input" placeholder="Password" />
          <input type="submit" id="password-btn" value="Login" />
          <p id="password-msg" style="margin-top:10px;color:yellow;"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- PESAN IYA/GA -->
  <div id="message-screen" style="display:none;">
    <div class="message-box">
      <h2>Barokallah fii umrik nilnaa..</h2>
      <p>Mau liat hadiah nya apa ga ni 😂?</p>
      <button id="btn-yes">iya</button>
      <button id="btn-no">ga</button>
    </div>
  </div>

  <!-- KONTEN TOMBOL HADIAH -->
  <div class="button-container">
    <button onclick="location.href='message.html'">MESSAGE</button>
    <button onclick="location.href='gallery.html'">🎁</button>
    <button onclick="location.href='music/index.html'">MUSIC</button>
    <button onclick="location.href='game/index.html'">GAME</button>
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const passwordBtn = document.getElementById('password-btn');
    const passwordMsg = document.getElementById('password-msg');
    const passwordInput = document.getElementById('password-input');
    const messageScreen = document.getElementById('message-screen');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const buttons = document.querySelector('.button-container');
    const audio = document.getElementById('bgm');

    const correctPass = "1708"; // Ganti sesuai keinginan

    // Cek password
    passwordBtn.addEventListener('click', () => {
      const pass = passwordInput.value.trim();
      if (pass === correctPass) {
        passwordMsg.textContent = "✅ Password benar ✅";
        audio.muted = false;
        audio.play();
        setTimeout(() => {
          passwordScreen.style.display = 'none';
          messageScreen.style.display = 'flex';
        }, 1200);
      } else if (pass === "") {
        passwordMsg.textContent = "⚠️ Masukkan password ⚠️";
      } else {
        passwordMsg.textContent = "❌ Password salah ❌";
      }
    });

    // Tombol iya
    btnYes.addEventListener('click', () => {
      messageScreen.style.display = 'none';
      buttons.style.display = 'flex';
    });

    // Tombol ga lari-lari
    btnNo.addEventListener('mouseover', () => {
      const box = messageScreen.getBoundingClientRect();
      const yesBtnRect = btnYes.getBoundingClientRect();
      let randomX, randomY;
      let tries = 0;
      do {
        randomX = Math.floor(Math.random() * (box.width - btnNo.offsetWidth - 20));
        randomY = Math.floor(Math.random() * (box.height - btnNo.offsetHeight - 20));
        tries++;
        if (tries > 50) break;
      } while (
        randomX > yesBtnRect.left - box.left - btnNo.offsetWidth &&
        randomX < yesBtnRect.right - box.left &&
        randomY > yesBtnRect.top - box.top - btnNo.offsetHeight &&
        randomY < yesBtnRect.bottom - box.top
      );
      btnNo.style.left = randomX + "px";
      btnNo.style.top = randomY + "px";
    });
  </script>
</body>
</html>
