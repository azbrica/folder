<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Folder Hadiah</title>
  </head>
  <body>

    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop id="bg-video">
      <source src="video.mp4" type="video/mp4" />
    </video>

    <!-- MUSIK BACKGROUND -->
    <audio id="bgm" autoplay loop muted>
      <source src="about.mp3" type="audio/mpeg" />
    </audio>

    <!-- KONTEN TOMBOL -->
    <div class="button-container">
      <button onclick="location.href='message.html'">MESSAGE</button>
      <button onclick="location.href='gallery.html'">🎁</button>
      <button onclick="location.href='music/index.html'">MUSIC</button>
      <button onclick="location.href='game/index.html'">GAME</button>
    </div>

    <!-- AKTIFKAN AUDIO SAAT USER INTERAKSI -->
    <script>
      window.addEventListener("click", function () {
        const audio = document.getElementById("bgm");
        audio.muted = false;
        audio.play();
      });
    </script>

  </body>
</html>
