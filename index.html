<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Folder Hadiah</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", cursive;
      text-align: center;
    }

    /* Video full background */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
    }

    /* Awal tombol klik */
    #start-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #btn-start {
      padding: 15px 30px;
      font-size: 20px;
      background-color: #ff66b2;
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 0 15px #ff66b2;
      cursor: pointer;
    }

    /* Pesan iya/ga */
    #message-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      backdrop-filter: blur(5px);
    }

    .message-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    #btn-yes, #btn-no {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      color: white; /* teks putih */
    }

    #btn-yes {
      background-color: #66ff99;
      box-shadow: 0 0 15px #66ff99;
    }

    #btn-no {
      background-color: #ff4444;
      position: absolute;
    }

    /* Container tombol hadiah */
    .button-container {
      display: none; /* disembunyikan awalnya */
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video autoplay muted loop id="bg-video">
    <source src="video.mp4" type="video/mp4" />
  </video>

  <!-- MUSIK BACKGROUND -->
  <audio id="bgm" autoplay loop muted>
    <source src="about.mp3" type="audio/mpeg" />
  </audio>

  <!-- LAYAR AWAL -->
  <div id="start-screen">
    <button id="btn-start">Klik untuk lihat</button>
  </div>

  <!-- PESAN IYA/GA -->
  <div id="message-screen">
    <div class="message-box">
      <h2>Barokallah fii umrik..</h2>
      <p>Mau liat hadiah nya apa ga ni wkwk?</p>
      <button id="btn-yes">Lyaaaa 😍</button>
      <button id="btn-no">Ga lah 😝</button>
    </div>
  </div>

  <!-- KONTEN TOMBOL HADIAH -->
  <div class="button-container">
    <button onclick="location.href='message.html'">MESSAGE</button>
    <button onclick="location.href='gallery.html'">🎁</button>
    <button onclick="location.href='music/index.html'">MUSIC</button>
    <button onclick="location.href='game/index.html'">GAME</button>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const messageScreen = document.getElementById('message-screen');
    const btnStart = document.getElementById('btn-start');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const buttons = document.querySelector('.button-container');
    const audio = document.getElementById('bgm');

    // Saat klik tombol mulai
    btnStart.addEventListener('click', () => {
      startScreen.style.display = 'none';
      messageScreen.style.display = 'flex';
    });

    // Tombol iya
    btnYes.addEventListener('click', () => {
      messageScreen.style.display = 'none';
      buttons.style.display = 'flex';
      audio.muted = false;
      audio.play();
    });

    // Tombol ga lari-lari
    btnNo.addEventListener('mouseover', () => {
      const box = messageScreen.getBoundingClientRect();
      const yesBtnRect = btnYes.getBoundingClientRect();

      let randomX, randomY;
      let tries = 0;
      do {
        randomX = Math.floor(Math.random() * (box.width - btnNo.offsetWidth - 20));
        randomY = Math.floor(Math.random() * (box.height - btnNo.offsetHeight - 20));
        tries++;
        if (tries > 50) break;
      } while (
        randomX > yesBtnRect.left - box.left - btnNo.offsetWidth &&
        randomX < yesBtnRect.right - box.left &&
        randomY > yesBtnRect.top - box.top - btnNo.offsetHeight &&
        randomY < yesBtnRect.bottom - box.top
      );

      btnNo.style.left = randomX + "px";
      btnNo.style.top = randomY + "px";
    });
  </script>

</body>
</html>
