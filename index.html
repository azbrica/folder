<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Click Effect</title>
  <link rel="stylesheet" href="login-style.css">
</head>
<body>

  <div class="box" id="loginBox">
    <h2 id="loginTitle">Login</h2>
    <div class="form">
      <input type="text" placeholder="Username" id="username"/>
      <input type="password" placeholder="Password" id="password"/>
      <input type="submit" value="Sign in" onclick="checkLogin()"/>
      <div class="group">
        <a href="#">Forgot Password</a>
        <a href="#">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    const loginBox = document.getElementById("loginBox");
    const loginTitle = document.getElementById("loginTitle");

    loginTitle.addEventListener("click", () => {
      loginBox.classList.toggle("active");
    });

    function checkLogin() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "zizah" && password === "1708") {
        window.location.href = "halamanberikutnya.html";
      } else {
        alert(`nama : "${username}"\npassword : "${password}"`);
      }
    }
  </script>

</body>
</html>
