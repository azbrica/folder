<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ucapan Ulang Tahun</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: black;
      color: #00ff99;
      overflow-x: hidden;
      text-align: center;
    }

    .message-box {
      border: 2px dotted #00ff99;
      padding: 1rem;
      background-color: #001f1f;
      border-radius: 12px;
      margin: 2rem;
      min-height: 200px;
      position: relative;
    }

    .scroll-hint {
      margin-top: 1rem;
      font-size: 1rem;
    }

    .audio-player {
      border-radius: 10px;
      padding: 1rem;
      background-color: #111;
      box-shadow: 0 0 20px #00ff99;
      width: 90%;
      max-width: 400px;
      margin: 2rem auto;
    }

    .cover {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      background-color: black;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: block;
    }

    #skip-btn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #00ff99;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Tombol kembali */
    .back-btn-wrapper {
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 2px dotted #00ff99;
      background-color: #001f1f;
      color: #00ff99;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.2s ease-in-out;
    }
    .back-btn:hover {
      background-color: #00ff99;
      color: black;
      box-shadow: 0 0 15px #00ff99, 0 0 30px #00ff99;
    }
  </style>
</head>
<body>

  <!-- Pesan Ulang Tahun -->
  <div class="message-box" id="message-box">
    <p id="typed-message"></p>
    <button id="skip-btn">SKIP</button>
  </div>

  <!-- Info Musik -->
  <div class="scroll-hint">⬇️ sama dengerin musik gasi:v 🎶</div>

  <!-- Video Cover + Audio Player -->
  <div class="audio-player">
    <video id="video" class="cover" muted loop playsinline>
      <source src="breathe.mp4" type="video/mp4">
      Browsermu tidak mendukung video.
    </video>

    <div><strong>breathe</strong></div>

    <audio id="audio" controls loop>
      <source src="lagu.mp3" type="audio/mpeg">
      Browsermu tidak mendukung pemutar audio.
    </audio>
  </div>

  <!-- Tombol Kembali -->
  <div class="back-btn-wrapper">
    <a href="halamanberikutnya.html" class="back-btn">⬅ Kembali</a>
  </div>

  <script>
    const text = `Barokallah fii umrik zah.. zizah 🙏😂

so..ini ya ga usah diapa²in wkwk,udah lega si ni bisa ngucapin :) gantian ygy 😂

kamsahamnida nilna 🥀 `;

    const messageElem = document.getElementById("typed-message");
    const skipBtn = document.getElementById("skip-btn");
    const video = document.getElementById("video");
    const audio = document.getElementById("audio");

    let index = 0;
    let speed = 70;
    let isSkipping = false;

    function typeText() {
      if (index < text.length && !isSkipping) {
        messageElem.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, speed);
      } else if (isSkipping) {
        messageElem.innerHTML = text.replace(/\n/g, "<br>");
      }
    }

    skipBtn.addEventListener("click", () => {
      isSkipping = true;
      messageElem.innerHTML = text.replace(/\n/g, "<br>");
    });

    // Sinkronisasi video dengan audio
    audio.addEventListener("play", () => {
      video.play();
    });

    audio.addEventListener("pause", () => {
      video.pause();
    });

    typeText();
  </script>
</body>
</html>
